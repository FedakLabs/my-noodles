name: Recover OpenTofu state

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref whose environment state should be recovered
        required: true
        default: main
        type: string
      environment:
        description: Infrastructure environment to recover
        required: true
        default: prod
        type: string
      neon-project-id:
        description: Existing Neon project ID to import
        required: true
        default: noisy-cake-54444281
        type: string
      r2-bucket-name:
        description: Existing R2 bucket name to import
        required: true
        default: my-noodles-media
        type: string

concurrency:
  group: recover-tofu-state-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  recover:
    name: Recover ${{ inputs.environment }} state
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      NEON_PROJECT_ID: ${{ inputs.neon-project-id }}
      R2_BUCKET_NAME: ${{ inputs.r2-bucket-name }}
    defaults:
      run:
        working-directory: devops/tofu/stack
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-infrastructure
        with:
          environment: ${{ inputs.environment }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN }}

      - name: Import existing resources
        shell: bash
        run: |
          set -euo pipefail

          R2_MANAGED_DOMAIN_ADDRESS="module.media.cloudflare_r2_managed_domain.this"
          R2_CUSTOM_DOMAIN_ADDRESS="module.media.cloudflare_r2_custom_domain.this"

          for address in "$R2_MANAGED_DOMAIN_ADDRESS" "$R2_CUSTOM_DOMAIN_ADDRESS"; do
            if tofu state show "$address" >/dev/null 2>&1; then
              continue
            fi

            echo "The non-importable Cloudflare R2 resource is missing from state: $address"
            echo "The pinned Cloudflare provider does not support importing this resource."
            echo "Delete only the existing resource in Cloudflare, run a successful tofu apply, and commit the resulting state before recovery."
            exit 1
          done

          import_if_missing() {
            local address="$1"
            local import_id="$2"

            if tofu state show "$address" >/dev/null 2>&1; then
              echo "Already tracked: $address"
              return
            fi

            echo "Importing $address"
            tofu import -input=false \
              -var-file="../envs/$DEPLOY_ENVIRONMENT/terraform.tfvars" \
              "$address" "$import_id"
          }

          if [[ "$(tofu console -var-file="../envs/$DEPLOY_ENVIRONMENT/terraform.tfvars" <<< 'var.manage_cloudflare_zone')" == "true" ]]; then
            import_if_missing \
              'module.cloudflare[0].cloudflare_zone_dnssec.this' \
              "$CLOUDFLARE_ZONE_ID"

            for setting_id in 0rtt always_use_https automatic_https_rewrites brotli early_hints http3 min_tls_version ssl tls_1_3; do
              import_if_missing \
                "module.cloudflare[0].cloudflare_zone_setting.baseline[\"$setting_id\"]" \
                "$CLOUDFLARE_ZONE_ID/$setting_id"
            done

            cache_rulesets_json="$(
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/rulesets?per_page=100"
            )"
            mapfile -t cache_ruleset_ids < <(
              jq -r '[.result[] | select(
                  .kind == "zone" and
                  .phase == "http_request_cache_settings" and
                  .name == "Public product media cache"
                ) | .id] | .[]' <<< "$cache_rulesets_json"
            )

            if (( ${#cache_ruleset_ids[@]} > 1 )); then
              echo "::error::Found multiple Cloudflare media cache rulesets with the same name. Resolve the duplicate before recovery."
              exit 1
            fi

            if (( ${#cache_ruleset_ids[@]} == 1 )); then
              import_if_missing \
                'module.cloudflare[0].cloudflare_ruleset.media_cache' \
                "$CLOUDFLARE_ZONE_ID/${cache_ruleset_ids[0]}"
            else
              echo "No existing Cloudflare media cache ruleset found; OpenTofu can create it during apply."
            fi
          else
            echo "Skipping shared Cloudflare imports because this environment does not manage the zone."
          fi

          import_if_missing \
            module.media.cloudflare_r2_bucket.this \
            "$CLOUDFLARE_ACCOUNT_ID/$R2_BUCKET_NAME/default"

          import_if_missing \
            module.neon.neon_project.main \
            "$NEON_PROJECT_ID"

          import_if_missing \
            module.grafana.grafana_folder.observability \
            "my-noodles-$DEPLOY_ENVIRONMENT"

          import_if_missing \
            module.grafana.grafana_dashboard.api \
            "my-noodles-api-$DEPLOY_ENVIRONMENT"

      - name: Commit recovered encrypted state
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          STATE_PATH="devops/tofu/envs/$DEPLOY_ENVIRONMENT/terraform.tfstate"
          STATE_COPY="$RUNNER_TEMP/tofu-$DEPLOY_ENVIRONMENT.tfstate"

          test -f "$STATE_PATH"
          cp "$STATE_PATH" "$STATE_COPY"
          git fetch origin "$REF"
          git checkout -B "$REF" "origin/$REF"
          cp "$STATE_COPY" "$STATE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH"
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore(tofu): recover encrypted $DEPLOY_ENVIRONMENT state"
          git push origin "HEAD:$REF"
