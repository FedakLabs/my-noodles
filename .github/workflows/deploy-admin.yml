name: Deploy admin

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/set-deployment-metadata
      - uses: ./.github/actions/setup-monorepo
        with:
          configure-affected: 'false'
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: prod
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /cloudflare
      - uses: ./.github/actions/load-deployment-environment
        with:
          application: admin
          environment: prod
      - name: Build admin
        env:
          VITE_APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: pnpm nx run admin:build
      - name: Deploy Static Assets Worker
        run: |
          pnpm exec wrangler deploy \
            --config devops/cloudflare/admin/wrangler.jsonc \
            --strict \
            --tag "$DEPLOY_SHA" \
            --message "Deploy $DEPLOY_SHA"
      - name: Smoke test admin
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.ADMIN_PUBLIC_URL }}/
      - name: Smoke test SPA fallback
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.ADMIN_PUBLIC_URL }}/orders
