name: Deploy admin

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string
      environment:
        description: Deployment environment configured under devops/envs
        required: true
        default: prod
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-admin-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-monorepo
        with:
          configure-affected: 'false'
      - uses: ./.github/actions/set-deployment-metadata
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: ${{ inputs.environment }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
          secret-path: /cloudflare
      - uses: ./.github/actions/load-deployment-environment
        with:
          application: admin
          environment: ${{ inputs.environment }}
      - name: Build admin
        env:
          VITE_APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: pnpm nx run admin:build
      - name: Deploy Static Assets Worker
        run: |
          pnpm --dir devops/cloudflare run admin:deploy -- \
            --strict \
            --tag "$DEPLOY_SHA" \
            --message "Deploy $DEPLOY_SHA"
      - name: Smoke test admin
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.ADMIN_PUBLIC_URL }}/
      - name: Smoke test SPA fallback
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.ADMIN_PUBLIC_URL }}/orders
