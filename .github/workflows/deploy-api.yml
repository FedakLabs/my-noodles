name: Deploy api

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string
      environment:
        description: Deployment environment configured under devops/envs
        required: true
        default: prod
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/validate-deployment-environment
        with:
          environment: ${{ inputs.environment }}
      - uses: ./.github/actions/set-deployment-metadata
      - uses: ./.github/actions/setup-monorepo
        with:
          configure-affected: 'false'
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: ${{ inputs.environment }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /cloudflare
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: ${{ inputs.environment }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /migrations
      - uses: ./.github/actions/load-deployment-environment
        with:
          application: api
          environment: ${{ inputs.environment }}
      - name: Validate API application
        run: pnpm nx run api:build
      - name: Validate Worker and Container build
        run: pnpm --dir devops/cloudflare run api:deploy -- --dry-run
      - name: Run migrations
        run: |
          : "${DATABASE_URL_DIRECT:?Missing required Infisical secret: DATABASE_URL_DIRECT}"
          DATABASE_URL="$DATABASE_URL_DIRECT" pnpm nx run api:migration:run
      - uses: ./.github/actions/export-api-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: ${{ inputs.environment }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
      - uses: ./.github/actions/deploy-api-worker
      - name: Smoke test edge
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.API_PUBLIC_URL }}/api/health/edge
      - name: Smoke test API readiness
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.API_PUBLIC_URL }}/api/health/ready
