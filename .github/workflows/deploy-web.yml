name: deploy-web

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch or SHA, without sha- prefix)'
        required: true
        default: 'main'
        type: string

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build · push · deploy web · prod
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve short SHA
        id: meta
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "short_sha=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/my-noodles-web:sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-monorepo

      - name: Type-check web
        run: pnpm nx run web:type-check

      - name: Test web
        run: pnpm nx run web:test

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve app SSH hosts
        id: hosts
        uses: ./.github/actions/resolve-app-hosts
        with:
          state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          fallback_hosts: ${{ secrets.DEPLOY_SSH_HOST }}

      - name: Deploy web (rolling)
        uses: ./.github/actions/deploy-compose-service
        with:
          service: web
          image_tag: ${{ steps.meta.outputs.image_tag }}
          ssh_host: ${{ steps.hosts.outputs.hosts }}
          ssh_user: ${{ secrets.DEPLOY_SSH_USER }}
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr_owner: ${{ github.repository_owner }}
          ghcr_token: ${{ secrets.GITHUB_TOKEN }}
