name: Deploy web

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/set-deployment-metadata
      - uses: ./.github/actions/setup-monorepo
        with:
          configure-affected: 'false'
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: prod
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /cloudflare
      - uses: ./.github/actions/load-deployment-environment
        with:
          application: web
          environment: prod
      - name: Deploy OpenNext Worker
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.DEPLOY_SHA }}
        run: pnpm deploy:web
      - name: Smoke test SSR health
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.NEXT_PUBLIC_SITE_URL }}/api/health/live
      - name: Smoke test storefront
        uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.NEXT_PUBLIC_SITE_URL }}/
