# Prod OpenTofu — CI-only. Plan/apply are infra-only.
# Host bootstrap lives in bootstrap-host.yml (called after apply).
# Do not tofu apply prod from a laptop.
#
# State: encrypted local file committed to git after apply.
# See devops/docs/state-backend.md.

name: tofu

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or SHA)'
        required: true
        default: 'main'
        type: string
      action:
        description: 'plan = plan only; apply = plan then apply that plan (+ bootstrap-host)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: tofu-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tofu:
    name: OpenTofu ${{ inputs.action }} · prod
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    defaults:
      run:
        working-directory: devops/tofu/envs/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.1

      - name: Export required provider env and TF_VAR_*
        env:
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          export_env() {
            local name="$1" val="$2"
            {
              echo "${name}<<EOF"
              echo "${val}"
              echo "EOF"
            } >> "$GITHUB_ENV"
          }
          export_env TF_VAR_state_passphrase "$TF_STATE_PASSPHRASE"
          export_env NEON_API_KEY "$NEON_API_KEY"
          export_env TF_VAR_hcloud_token "$HCLOUD_TOKEN"
          export_env TF_VAR_cloudflare_api_token "$CLOUDFLARE_API_TOKEN"
          export_env TF_VAR_cloudflare_account_id "$CLOUDFLARE_ACCOUNT_ID"
          export_env TF_VAR_cloudflare_zone_id "$CLOUDFLARE_ZONE_ID"
          export_env TF_VAR_ssh_public_key "$DEPLOY_SSH_PUBLIC_KEY"
          export_env TF_VAR_neon_org_id "$NEON_ORG_ID"
          export_env TF_VAR_object_storage_access_key "$S3_ACCESS_KEY"
          export_env TF_VAR_object_storage_secret_key "$S3_SECRET_KEY"

      - name: Export optional TF_VAR_* from Environment vars (skip empties)
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          DOMAIN: ${{ vars.DOMAIN }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          APP_SERVERS: ${{ vars.APP_SERVERS }}
          SERVER_TYPE: ${{ vars.SERVER_TYPE }}
          HETZNER_LOCATION: ${{ vars.HETZNER_LOCATION }}
          NEON_SUSPEND_TIMEOUT_SECONDS: ${{ vars.NEON_SUSPEND_TIMEOUT_SECONDS }}
          SSH_ALLOWED_CIDRS: ${{ vars.SSH_ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          maybe() {
            local name="$1" val="$2"
            if [[ -n "$val" ]]; then
              {
                echo "${name}<<EOF"
                echo "${val}"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "set $name"
            else
              echo "skip $name (empty — tofu default)"
            fi
          }
          maybe TF_VAR_object_storage_endpoint "$S3_ENDPOINT"
          maybe TF_VAR_object_storage_region "$S3_REGION"
          maybe TF_VAR_object_storage_bucket "$S3_BUCKET"
          maybe TF_VAR_domain "$DOMAIN"
          maybe TF_VAR_project_name "$PROJECT_NAME"
          maybe TF_VAR_admin_pages_project "$CLOUDFLARE_PAGES_PROJECT"
          maybe TF_VAR_app_servers "$APP_SERVERS"
          maybe TF_VAR_server_type "$SERVER_TYPE"
          maybe TF_VAR_location "$HETZNER_LOCATION"
          maybe TF_VAR_neon_suspend_timeout_seconds "$NEON_SUSPEND_TIMEOUT_SECONDS"
          # JSON list, e.g. ["203.0.113.10/32"] — OpenTofu list(string) via TF_VAR_
          maybe TF_VAR_ssh_allowed_cidrs "$SSH_ALLOWED_CIDRS"

      - name: tofu init
        run: tofu init -input=false

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        run: tofu plan -input=false -out=tfplan

      - name: tofu apply
        if: ${{ inputs.action == 'apply' }}
        run: tofu apply -input=false tfplan

      - name: Commit encrypted state
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          STATE_PATH="devops/tofu/envs/prod/terraform.tfstate"
          if ! git ls-remote --exit-code --heads origin "$REF" >/dev/null 2>&1; then
            echo "::error::action=apply requires a branch ref (e.g. main), not a bare SHA — encrypted state must be pushed to a branch."
            exit 1
          fi
          # Detached SHA / mid-apply checkout: re-attach onto the remote branch tip, keep only the new state file.
          cp "$STATE_PATH" /tmp/tofu-prod.tfstate
          git fetch origin "$REF"
          git checkout -f -B "$REF" "origin/$REF"
          cp /tmp/tofu-prod.tfstate "$STATE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH"
          if git diff --staged --quiet; then
            echo "No state file changes to commit."
            exit 0
          fi
          git commit -m "chore(tofu): update encrypted prod state"
          git push origin "HEAD:$REF"

      - name: Show outputs (after apply)
        if: ${{ inputs.action == 'apply' }}
        run: tofu output

  bootstrap:
    name: Bootstrap app host · prod
    needs: [tofu]
    if: ${{ inputs.action == 'apply' }}
    uses: ./.github/workflows/bootstrap-host.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
