name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string
      action:
        required: true
        default: plan
        type: choice
        options: [plan, apply]

concurrency:
  group: infrastructure-prod
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tofu:
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: devops/tofu/envs/prod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Require main for production apply
        if: ${{ inputs.action == 'apply' }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$REF" != "main" ]]; then
            echo "::error::Production apply must use ref=main so encrypted state remains authoritative."
            exit 1
          fi
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: prod
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /cloudflare
      - uses: ./.github/actions/load-infisical-secrets
        with:
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          environment-slug: prod
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: /infra
      - name: Configure OpenTofu environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID GRAFANA_SERVICE_ACCOUNT_TOKEN
            GRAFANA_URL NEON_API_KEY NEON_ORG_ID TF_STATE_PASSPHRASE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Infisical secret: $name"
              exit 1
            fi
          done
          {
            printf 'GRAFANA_AUTH=%s\n' "$GRAFANA_SERVICE_ACCOUNT_TOKEN"
            printf 'TF_VAR_state_passphrase=%s\n' "$TF_STATE_PASSPHRASE"
            printf 'TF_VAR_cloudflare_api_token=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'TF_VAR_cloudflare_account_id=%s\n' "$CLOUDFLARE_ACCOUNT_ID"
            printf 'TF_VAR_cloudflare_zone_id=%s\n' "$CLOUDFLARE_ZONE_ID"
            printf 'TF_VAR_grafana_url=%s\n' "$GRAFANA_URL"
            printf 'TF_VAR_neon_org_id=%s\n' "$NEON_ORG_ID"
          } >> "$GITHUB_ENV"
          if [[ -n "${MEDIA_BUCKET:-}" ]]; then
            printf 'TF_VAR_media_bucket=%s\n' "$MEDIA_BUCKET" >> "$GITHUB_ENV"
          fi
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: OpenTofu init
        run: tofu init -input=false
      - name: OpenTofu validate
        run: tofu validate
      - name: OpenTofu plan
        run: tofu plan -input=false -out="$RUNNER_TEMP/prod.tfplan"
      - name: OpenTofu apply
        if: ${{ inputs.action == 'apply' }}
        run: tofu apply -auto-approve -input=false "$RUNNER_TEMP/prod.tfplan"
      - name: Commit encrypted state
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          STATE_PATH="devops/tofu/envs/prod/terraform.tfstate"
          cp "$STATE_PATH" "$RUNNER_TEMP/tofu-prod.tfstate"
          git fetch origin "$REF"
          git checkout -B "$REF" "origin/$REF"
          cp "$RUNNER_TEMP/tofu-prod.tfstate" "$STATE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devops/tofu/envs/prod/terraform.tfstate
          if git diff --staged --quiet; then
            echo "No encrypted state changes to commit."
            exit 0
          fi
          git commit -m "chore(tofu): update encrypted prod state"
          git push origin "HEAD:$REF"
