name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
        type: string
      environment:
        description: Infrastructure environment configured under devops/tofu/envs
        required: true
        default: prod
        type: string

concurrency:
  group: infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tofu-plan:
    name: OpenTofu plan
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: devops/tofu/stack
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-infrastructure
        with:
          environment: ${{ inputs.environment }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
      - name: OpenTofu validate
        run: tofu validate
      - name: OpenTofu plan
        run: >-
          tofu plan -input=false
          -var-file="../envs/$DEPLOY_ENVIRONMENT/terraform.tfvars"
          -out="$RUNNER_TEMP/tofu.tfplan"
      - name: Upload OpenTofu plan
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tofu.tfplan
          if-no-files-found: error
          retention-days: 1

  tofu-apply:
    name: OpenTofu apply
    needs: tofu-plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: devops/tofu/stack
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-infrastructure
        with:
          environment: ${{ inputs.environment }}
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          domain: ${{ vars.INFISICAL_DOMAIN }}
      - name: Download OpenTofu plan
        uses: actions/download-artifact@v5
        with:
          name: tofu-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: OpenTofu apply
        run: tofu apply -auto-approve -input=false "$RUNNER_TEMP/tofu.tfplan"
      - name: Commit encrypted state
        working-directory: ${{ github.workspace }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          STATE_PATH="devops/tofu/envs/$DEPLOY_ENVIRONMENT/terraform.tfstate"
          STATE_COPY="$RUNNER_TEMP/tofu-$DEPLOY_ENVIRONMENT.tfstate"
          cp "$STATE_PATH" "$STATE_COPY"
          git fetch origin "$REF"
          git checkout -B "$REF" "origin/$REF"
          cp "$STATE_COPY" "$STATE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STATE_PATH"
          if git diff --staged --quiet; then
            echo "No encrypted state changes to commit."
            exit 0
          fi
          git commit -m "chore(tofu): update encrypted $DEPLOY_ENVIRONMENT state"
          git push origin "HEAD:$REF"
