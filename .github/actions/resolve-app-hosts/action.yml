name: Resolve app SSH hosts
description: Prefer tofu output app_ipv4 (CSV); fall back to a secret/override CSV.

inputs:
  fallback_hosts:
    description: 'Comma-separated SSH hosts if tofu output is empty'
    required: false
    default: ''
  working_directory:
    description: 'OpenTofu env directory'
    required: false
    default: devops/tofu/envs/prod
  state_passphrase:
    description: 'TF_STATE_PASSPHRASE for encrypted state'
    required: true

outputs:
  hosts:
    description: 'Comma-separated app VM IPv4 addresses'
    value: ${{ steps.resolve.outputs.hosts }}

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.9.1

    - name: Resolve hosts from tofu (or fallback)
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_STATE_PASSPHRASE: ${{ inputs.state_passphrase }}
        FALLBACK_HOSTS: ${{ inputs.fallback_hosts }}
      run: |
        set -euo pipefail
        {
          echo "TF_VAR_state_passphrase<<EOF"
          echo "${TF_STATE_PASSPHRASE}"
          echo "EOF"
        } >> "$GITHUB_ENV"
        export TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE"
        tofu init -input=false

        HOSTS="$(tofu output -json app_ipv4 2>/dev/null | jq -r 'if type=="array" then join(",") else empty end' || true)"
        if [[ -z "$HOSTS" ]]; then
          HOSTS="$FALLBACK_HOSTS"
          echo "Using fallback DEPLOY_SSH_HOST"
        else
          echo "Using tofu output app_ipv4"
        fi
        if [[ -z "$HOSTS" ]]; then
          echo "::error::No app hosts — tofu app_ipv4 empty and no fallback_hosts"
          exit 1
        fi
        echo "hosts=${HOSTS}" >> "$GITHUB_OUTPUT"
        echo "Resolved hosts: ${HOSTS}"
