name: Setup monorepo
description: pnpm, Node, install deps, nx affected SHAs, and Nx task cache

inputs:
  configure-affected:
    description: Configure Nx base/head SHAs for affected commands
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11.8.0

    - name: Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure nx affected SHAs
      if: ${{ inputs.configure-affected == 'true' }}
      uses: nrwl/nx-set-shas@v5

    - name: Restore Nx cache
      uses: actions/cache@v5
      with:
        path: .nx/cache
        key: nx-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nx-v1-${{ runner.os }}-
