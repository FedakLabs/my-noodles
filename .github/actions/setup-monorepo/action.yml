name: Setup monorepo
description: pnpm, Node, install deps, nx affected SHAs, and Nx task cache

runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.8.0

    - name: Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Configure nx affected SHAs
      uses: nrwl/nx-set-shas@v4

    - name: Restore Nx cache
      uses: actions/cache@v4
      with:
        path: .nx/cache
        key: nx-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nx-v1-${{ runner.os }}-
