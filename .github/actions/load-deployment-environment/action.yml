name: Load deployment environment
description: Export committed non-secret configuration for one application and environment

inputs:
  application:
    description: Application configuration to load
    required: true
  environment:
    description: Deployment environment to load
    required: true

runs:
  using: composite
  steps:
    - name: Load public configuration
      shell: bash
      run: node .github/scripts/load-deployment-environment.mjs "${{ inputs.environment }}" "${{ inputs.application }}"
