name: Load Infisical secrets
description: Authenticate with GitHub OIDC and expose one Infisical environment to subsequent steps

inputs:
  identity-id:
    description: Infisical machine identity ID
    required: true
  project-slug:
    description: Infisical project slug
    required: true
  environment-slug:
    description: Infisical environment slug
    required: false
    default: prod
  domain:
    description: Infisical Cloud or self-hosted base URL
    required: false
    default: https://app.infisical.com
  secret-path:
    description: Infisical folder to expose to subsequent steps
    required: true

runs:
  using: composite
  steps:
    - name: Fetch secrets with OIDC
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
      with:
        method: oidc
        identity-id: ${{ inputs.identity-id }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.environment-slug }}
        domain: ${{ inputs.domain }}
        export-type: env
        secret-path: ${{ inputs.secret-path }}
        recursive: false
