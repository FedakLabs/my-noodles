policy:
  # Set to null to allow an approved infrastructure apply from any Git ref.
  infrastructureApplyRef: main

cloudflare:
  web:
    workerName: my-noodles-web
    domains:
      - mynoodles.shop
      - www.mynoodles.shop
  admin:
    workerName: my-noodles-admin
    domains:
      - admin.mynoodles.shop
  api:
    workerName: my-noodles-api
    domains:
      - api.mynoodles.shop

applications:
  web:
    NEXT_PUBLIC_API_URL: https://api.mynoodles.shop
    NEXT_PUBLIC_SITE_URL: https://mynoodles.shop
    # Optional integrations. Uncomment and provide a value when configured.
    # NEXT_PUBLIC_GTM_ID: GTM-XXXXXXX
    # NEXT_PUBLIC_SENTRY_DSN: https://<key>@o<org>.ingest.sentry.io/<project>
  admin:
    ADMIN_PUBLIC_URL: https://admin.mynoodles.shop
    VITE_API_URL: https://api.mynoodles.shop
    VITE_AUTH_API_URL: https://api.mynoodles.shop
    # Optional integration. Uncomment and provide a value when configured.
    # VITE_SENTRY_DSN: https://<key>@o<org>.ingest.sentry.io/<project>
  api:
    API_PUBLIC_URL: https://api.mynoodles.shop
    OTEL_ENABLED: 'true'
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=my-noodles
    OTEL_SERVICE_NAME: my-noodles-api
