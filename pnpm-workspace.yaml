packages:
  - 'apps/*'
  - 'packages/*'
  - 'configs/*'

minimumReleaseAge: 0

allowBuilds:
  '@openapitools/openapi-generator-cli': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  less: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
